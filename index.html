<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TOPSIS Decision and Sensitivity Analysis พร้อม Excel Import, PDF Report และดาวน์โหลดไฟล์">
  <title>TOPSIS Decision & Sensitivity Analysis</title>
  <style>
    :root{font-family:Inter,"Noto Sans Thai","Segoe UI",Tahoma,sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .loader{width:min(560px,100%);background:#fff;border:1px solid #dfe4ec;border-radius:18px;padding:30px;box-shadow:0 12px 34px rgba(30,51,83,.10);text-align:center}
    .mark{width:52px;height:52px;margin:0 auto 16px;border-radius:15px;background:#2257a6;color:#fff;display:grid;place-items:center;font-weight:850;font-size:17px}
    h1{font-size:24px;line-height:1.25;margin:0 0 8px}p{margin:0;color:#677086;line-height:1.6}
    .bar{height:8px;background:#e8edf5;border-radius:999px;overflow:hidden;margin:22px 0 12px}.bar:before{content:"";display:block;height:100%;width:38%;background:#2257a6;border-radius:999px;animation:move 1.1s ease-in-out infinite alternate}
    .error{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#fff0ee;color:#b42318;text-align:left;font-size:13px;overflow-wrap:anywhere}
    @keyframes move{from{transform:translateX(-20%)}to{transform:translateX(185%)}}
  </style>
</head>
<body>
  <main class="loader" id="loader">
    <div class="mark">TOP</div>
    <h1>TOPSIS Decision & Sensitivity Analysis</h1>
    <p id="status">กำลังโหลดเครื่องมือวิเคราะห์...</p>
    <div class="bar" aria-hidden="true"></div>
    <div class="error" id="errorBox"></div>
  </main>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    const errorBox=document.getElementById('errorBox');
    try{
      if(typeof DecompressionStream==='undefined'){
        throw new Error('เบราว์เซอร์นี้ไม่รองรับการโหลดแอป กรุณาใช้ Chrome, Edge, Firefox หรือ Safari รุ่นปัจจุบัน');
      }
      status.textContent='กำลังเตรียม Excel Import, TOPSIS, Sensitivity และ PDF Report...';
      const response=await fetch('./app.html.gz.b64?build=20260903-downloads',{cache:'no-store'});
      if(!response.ok) throw new Error(`ไม่สามารถโหลดไฟล์แอปได้ (HTTP ${response.status})`);
      const encoded=(await response.text()).trim();
      const compressed=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
      const decompressedStream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(decompressedStream).text();
      if(!html.includes('2026-09-03-downloads-deploy')) throw new Error('ไฟล์แอปไม่ตรงกับรุ่นที่เผยแพร่');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error(error);
      status.textContent='โหลดเครื่องมือไม่สำเร็จ';
      errorBox.style.display='block';
      errorBox.textContent=error.message || String(error);
    }
  })();
  </script>
</body>
</html>
