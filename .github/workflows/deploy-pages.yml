name: Deploy TOPSIS Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild static TOPSIS page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat chunks/app-0.txt chunks/app-1.txt chunks/app-2.txt chunks/app-3.txt chunks/app-4.txt \
            | tr -d '\n\r ' \
            | base64 --decode \
            | gzip --decompress > _site/index.html
          touch _site/.nojekyll
          grep -q '2026-09-03-downloads-deploy' _site/index.html
          grep -q 'function downloadBlob' _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
